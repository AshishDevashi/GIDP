services:
  db:
    image: postgres:16-alpine
    container_name: gidp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wolf_platform
    ports:
      - "5432:5432"
    volumes:
      - gidp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wolf_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gidp-app
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/wolf_platform?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  gidp_pgdata:
